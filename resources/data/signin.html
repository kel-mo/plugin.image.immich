<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Immich on Kodi</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 16px/1.45 system-ui, sans-serif; background: #0e121a; color: #e8ebf2; }
  main { max-width: 30rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.25rem; color: #9aa3b5; }
  .msg { padding: .75rem 1rem; border-radius: .6rem; margin-bottom: 1.25rem; }
  .err { background: #4a1d25; color: #ffc9d0; }
  .ok { background: #173d2c; color: #bff2d6; }
  label { display: block; font-size: .9rem; color: #9aa3b5; margin: 1rem 0 .3rem; }
  input { box-sizing: border-box; width: 100%; padding: .7rem .8rem; font-size: 1rem; border-radius: .5rem;
          border: 1px solid #2d3649; background: #161c28; color: inherit; }
  button { margin-top: 1.25rem; width: 100%; padding: .8rem; font-size: 1rem; font-weight: 600; border: 0;
           border-radius: .6rem; background: #ff6f7d; color: #0e121a; }
  details { margin-top: 1.5rem; border-top: 1px solid #232b3b; padding-top: 1rem; }
  summary { cursor: pointer; font-weight: 600; }
  code { font-size: .85rem; color: #ffb38a; }
  a { color: #ff9a5c; }
  small { color: #7d869a; }
</style>
</head>
<body>
<main>
  <h1>Sign in to Immich on Kodi</h1>
  <p class="sub">$device</p>
  $message
  <form method="post">
    <label for="server">Immich server address</label>
    <input id="server" name="server" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
           placeholder="https://photos.example.com" value="$server" required>

    <label for="api_key">API key</label>
    <input id="api_key" name="api_key" autocapitalize="off" autocorrect="off" autocomplete="off"
           placeholder="Paste an API key">
    <small>In Immich open <a href="$keys_url" target="_blank" rel="noopener">Account settings → API keys</a>,
      create a key and paste it here. Kodi only needs these permissions:
      <code>$scopes</code></small>

    <details $open_password>
      <summary>Or sign in with email and password</summary>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocapitalize="off" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <small>Kodi creates a read-only API key named “$key_name” and forgets the password.</small>
    </details>

    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
